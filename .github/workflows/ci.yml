# CI de qualidade, arquitetura e segurança (F0.4 — ADR-012).
# Política de falha:
#   BLOQUEANTE: build, typecheck, lint, testes, fronteiras (depcruise),
#               vulnerabilidade high/critical em dependências, secret detectado.
#   AVISO:      vulnerabilidades moderadas/baixas (job informativo, não bloqueia).
#   EXCEÇÃO:    deve ser documentada em PR e aprovada em revisão (ver
#               docs/governance/pr-review.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalação reproduzível
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes (inclui testes de arquitetura)
        run: pnpm test
      - name: Fronteiras arquiteturais e ciclos (dependency-cruiser)
        run: pnpm depcruise
      - name: Build
        run: pnpm build

  dependency-audit:
    name: Auditoria de dependências (bloqueia high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalação reproduzível
        run: pnpm install --frozen-lockfile
      - name: Auditoria (falha em high/critical)
        run: pnpm audit --audit-level high

  dependency-audit-informational:
    name: Auditoria informativa (moderadas/baixas — não bloqueia)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalação reproduzível
        run: pnpm install --frozen-lockfile
      - name: Auditoria completa (informativa)
        run: pnpm audit

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (histórico completo, saída com redação)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --exit-code 1
