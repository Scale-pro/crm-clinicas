# SAST via CodeQL (F0.4 — ADR-012).
# Observação: em repositórios privados de organização, o code scanning pode
# exigir GitHub Advanced Security habilitado no plano — ver
# docs/ops/f0-done-checklist.md (ativações manuais).
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # semanal, segunda-feira

permissions:
  contents: read

jobs:
  analyze:
    name: Análise CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
